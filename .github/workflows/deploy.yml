name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN only needs to check the repository out; the repository default
# tends to be broader, and this pipeline should not carry scope it never uses.
permissions:
  contents: read

# Queue instead of cancel: two rsyncs racing into the same directory could serve a
# visitor a half-replaced docroot, and cancelling one mid-copy would leave exactly
# that half-copied state behind.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung job here would sit on the runner for hours; once deploys queue behind
    # each other, that also blocks every later deploy waiting its turn.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A hung deploy would otherwise block every later deploy queued behind it for
    # GitHub's ~6-hour default, on top of being a slow failure on its own.
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # Pin the server's key instead of trusting whatever answers first.
      - name: Trust the server
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_HOST_KEY }}" > ~/.ssh/known_hosts
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/known_hosts ~/.ssh/deploy_key

      # The server runs nothing of its own: nginx already serves this directory.
      - name: Publish
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes" \
            dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/"
